<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview & Tester - Auth Pages</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .view-switcher {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 30px;
      padding: 4px;
      display: flex;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      z-index: 9999;
    }
    .switch-btn {
      border: none;
      background: none;
      padding: 6px 14px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      color: #555;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .switch-btn.active {
      background: #333;
      color: #fff;
    }
    .view-section {
      display: none;
      width: 100%;
      justify-content: center;
    }
    .view-section.active {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- View Switcher for Testing -->
  <div class="view-switcher">
    <button class="switch-btn active" onclick="switchView('login')">1. Masuk Akun</button>
    <button class="switch-btn" onclick="switchView('register')">2. Buat Akun</button>
    <button class="switch-btn" onclick="switchView('success')">3. Berhasil Masuk</button>
  </div>

  <!-- 1. Masuk Akun (Login) -->
  <div id="view-login" class="view-section active">
    <div class="auth-card">
      <h1 class="auth-title">Masuk Akun</h1>
      <form onsubmit="event.preventDefault(); switchView('success');">
        <div class="form-group">
          <label for="test-login-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="test-login-email" class="input-field" placeholder="Masukkan Email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="test-login-password">Password</label>
          <div class="input-wrapper has-icon">
            <input type="password" id="test-login-password" class="input-field" placeholder="Masukkan Password" required>
            <button type="button" class="eye-icon-btn" aria-label="Toggle password" onclick="togglePassword('test-login-password')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#788686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="btn-row-right">
          <button type="submit" class="btn-submit">Masuk</button>
        </div>

        <p class="auth-footer">
          Belum memiliki akun? <a href="#" onclick="switchView('register')">Buat sekarang disini.</a>
        </p>
      </form>
    </div>
  </div>

  <!-- 2. Buat Akun (Register) -->
  <div id="view-register" class="view-section">
    <div class="auth-card">
      <h1 class="auth-title">Buat Akun</h1>
      <form onsubmit="event.preventDefault(); switchView('success');">
        <div class="form-group">
          <label for="test-reg-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="test-reg-email" class="input-field" placeholder="Masukkan Email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="test-reg-password">Password</label>
          <div class="input-wrapper has-icon">
            <input type="password" id="test-reg-password" class="input-field" placeholder="Masukkan Password" required>
            <button type="button" class="eye-icon-btn" aria-label="Toggle password" onclick="togglePassword('test-reg-password')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#788686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="test-reg-confirm">Konfirmasi Password</label>
          <div class="input-wrapper">
            <input type="password" id="test-reg-confirm" class="input-field" placeholder="Masukkan Password" required>
          </div>
        </div>

        <div class="btn-row-center">
          <button type="submit" class="btn-submit">Buat Akun</button>
        </div>

        <hr class="auth-divider">

        <p class="social-title">Atau lanjut dengan</p>

        <div class="social-buttons">
          <a href="#" class="social-btn" aria-label="WhatsApp">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="11" fill="#25D366"/>
              <path d="M17.5 14.4c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7.9-.1.2-.3.2-.5.1-.2-.1-.9-.3-1.8-1.1-.7-.6-1.1-1.3-1.3-1.5-.1-.2 0-.4.1-.5.1-.1.2-.3.3-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4 0-.1-.5-1.2-.7-1.6-.2-.4-.4-.3-.5-.3h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.6.6.2 1.2.2 1.7.1.5-.1 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2-.1-.2-.3-.3-.5-.4z" fill="#FFFFFF"/>
            </svg>
          </a>
          <a href="#" class="social-btn" aria-label="Instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="ig-grad-tester" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#f09433"/>
                  <stop offset="25%" stop-color="#e6683c"/>
                  <stop offset="50%" stop-color="#dc2743"/>
                  <stop offset="75%" stop-color="#cc2366"/>
                  <stop offset="100%" stop-color="#bc1888"/>
                </linearGradient>
              </defs>
              <rect x="2.5" y="2.5" width="19" height="19" rx="5" ry="5" fill="none" stroke="url(#ig-grad-tester)" stroke-width="2"/>
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="url(#ig-grad-tester)" stroke-width="2"/>
              <circle cx="17.2" cy="6.8" r="1.1" fill="url(#ig-grad-tester)"/>
            </svg>
          </a>
          <a href="#" class="social-btn" aria-label="X">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="11" fill="#000000"/>
              <path d="M14.7 7h1.8l-3.9 4.5 4.6 6.1h-3.6l-2.8-3.7-3.3 3.7H5.7l4.2-4.8L5.4 7h3.7l2.6 3.4L14.7 7zm-.6 9.5h1l-6.4-8.5H7.7l6.4 8.5z" fill="#FFFFFF"/>
            </svg>
          </a>
          <a href="#" class="social-btn" aria-label="Google">
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
          </a>
        </div>

        <p class="auth-footer">
          Sudah memiliki akun? <a href="#" onclick="switchView('login')">Masuk sekarang disini.</a>
        </p>
      </form>
    </div>
  </div>

  <!-- 3. Berhasil Masuk (Success) -->
  <div id="view-success" class="view-section">
    <div class="success-card" style="cursor: pointer;" onclick="switchView('login')" title="Klik untuk kembali ke Masuk Akun">
      <p class="success-message">Anda berhasil masuk ke akun!</p>
    </div>
  </div>

  <script>
    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.switch-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('view-' + viewName).classList.add('active');

      const btnIndex = viewName === 'login' ? 0 : (viewName === 'register' ? 1 : 2);
      document.querySelectorAll('.switch-btn')[btnIndex].classList.add('active');
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
</body>
</html>

</html>
