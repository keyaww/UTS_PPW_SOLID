<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">
    <h1 class="auth-title">Masuk Akun</h1>

    <form action="success.html" method="get">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-field" 
            placeholder="Masukkan Email" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper has-icon">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="Masukkan Password" 
            required
          >
          <button 
            type="button" 
            class="eye-icon-btn" 
            aria-label="Tampilkan / Sembunyikan Password" 
            onclick="togglePassword('password')"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#788686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="btn-row-right">
        <button type="submit" class="btn-submit">Masuk</button>
      </div>

      <p class="auth-footer">
        Belum memiliki akun? <a href="register.html">Buat sekarang disini.</a>
      </p>
    </form>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
</body>
</html>
